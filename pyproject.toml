[project]
name = "audiobook"
version = "0.1.0"
description = "Pipeline sản xuất video truyện audio cho YouTube"
requires-python = ">=3.11"
dependencies = [
    "gemini-webapi>=1.0.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "vieneu",
    "torch",       # CPU only: needed by vieneu's ONNX speaker-embedding path for voice cloning (fbank extraction), not for TTS inference itself
    "torchaudio",  # CPU only: same reason as torch above
    "pyloudnorm>=0.1.1",
    "soundfile>=0.12.1",
    "mflux",
    "Pillow",
    "google-api-python-client>=2.100.0",  # upload/: videos.insert + thumbnails.set; trend/: search.list
    "google-auth-oauthlib>=1.2.0",        # upload/auth.py: OAuth desktop flow một lần
    "google-auth-httplib2>=0.2.0",        # transport cho google-api-python-client
    "scipy>=1.17.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
