tropes:
  - id: trong_sinh_bao_thu
    name: "Trọng sinh báo thù"
    description: >
      Nhân vật chính chết oan hoặc bị hại ở kiếp trước, trọng sinh về quá khứ
      với ký ức nguyên vẹn, dùng hiểu biết đó để thay đổi số phận và trả thù
      những kẻ đã hãm hại mình.
  - id: xuyen_khong_gia_toc
    name: "Xuyên không vào gia tộc hào môn"
    description: >
      Nhân vật chính xuyên không vào thân phận một tiểu thư/thiếu gia bị coi
      thường trong gia tộc giàu có, dần bộc lộ thực lực khiến cả nhà kinh ngạc.
  - id: duong_nu_phan_don
    name: "Dưỡng nữ bị hắt hủi rồi phản đòn"
    description: >
      Con nuôi bị gia đình đối xử bất công so với con ruột, sau biến cố phát
      hiện thân thế thật hoặc năng lực đặc biệt, phản đòn ngoạn mục.
  - id: tong_tai_sung_vo
    name: "Tổng tài lạnh lùng sủng vợ"
    description: >
      Vị tổng tài lạnh lùng, quyền lực bất ngờ hết lòng cưng chiều người vợ
      bị xem thường, khiến những kẻ từng coi thường cô phải trả giá.
  - id: anh_chi_em_tranh_sung
    name: "Anh chị em ruột tranh sủng"
    description: >
      Trong một gia đình nhiều anh chị em, nhân vật chính bị lép vế tình cảm
      cha mẹ dành cho anh/chị/em khác, đến khi sự thật và tài năng thật sự
      của nhân vật chính được phơi bày.
  - id: va_mat_cong_so
    name: "Vả mặt đồng nghiệp cặn bã chốn công sở"
    description: >
      Nhân vật chính có thân thế hoặc thực lực khủng nhưng ẩn giấu, đi làm
      như một nhân viên bình thường. Bị đồng nghiệp cặn bã chèn ép, cướp công,
      hãm hại và bị sếp coi thường, nhân vật chính từng bước dùng chính thực
      lực của mình vạch trần và "vả mặt" từng kẻ xấu, khiến cả công ty chấn
      động khi thân thế thật được hé lộ.
  - id: phe_vat_nghich_tap
    name: "Phế vật nghịch tập"
    description: >
      Nhân vật chính bị cả gia tộc/dòng họ coi là phế vật, không có tư chất,
      thường xuyên bị khinh thường và chế giễu công khai. Sau một biến cố,
      tài năng hoặc sức mạnh thực sự bị che giấu bấy lâu bộc phát, khiến tất
      cả những kẻ từng coi thường phải kinh ngạc và hối hận.
  - id: trong_sinh_mat_the
    name: "Trọng sinh trước ngày tận thế"
    description: >
      Nhân vật chính chết thảm trong ngày tận thế ở kiếp trước, trọng sinh về
      vài ngày trước thảm hoạ với ký ức nguyên vẹn về mọi thứ sắp xảy ra.
      Trong khi người thân và hàng xóm chế giễu là điên rồ, hoang tưởng, nhân
      vật chính âm thầm dốc sạch tiền bạc thu gom lương thực, nước sạch, thuốc
      men, nhiên liệu và vật tư sinh tồn, gia cố nơi trú ẩn. Đến khi tận thế
      thật sự ập xuống đúng như ký ức, những kẻ từng cười nhạo phải hối hận và
      cầu xin giúp đỡ, còn nhân vật chính dùng hiểu biết đi trước một bước để
      bảo vệ người mình thương và từng bước giành lấy sự sống.
  - id: nghe_thau_tieng_long
    name: "Nghe thấu tiếng lòng người khác"
    description: >
      Sau một biến cố bất ngờ, nhân vật chính có được năng lực nghe được suy
      nghĩ thật sự trong lòng của bất kỳ ai xung quanh, dù ngoài miệng họ nói
      hoàn toàn khác. Nhờ vậy, nhân vật chính nhìn thấu bộ mặt thật của những
      kẻ giả tạo, âm mưu hãm hại mình trong gia đình, công sở hoặc tình cảm,
      kịp thời né tránh cạm bẫy và đưa ra quyết định đúng đắn trước khi quá
      muộn. Ban đầu phải giấu kín năng lực và học cách chịu đựng khi nghe được
      những suy nghĩ tàn nhẫn từ người thân cận, nhưng dần dần dùng chính khả
      năng đặc biệt này để bảo vệ những người thật lòng tốt với mình và vạch
      trần từng kẻ hai mặt, khiến tất cả phải kinh ngạc.
  - id: tu_van_tinh_cam_tien_ty
    name: "Nhận Kèo Tư Vấn Tình Cảm Tiền Tỷ Của Sếp, Ai Ngờ Nạn Nhân Lại Là Bản Thân"
    description: >
      Nhân vật chính là chuyên gia tư vấn tình cảm giỏi giang, được sếp giao
      một "kèo" tư vấn bí mật trị giá tiền tỷ cho một khách hàng cấp cao đang
      gặp khủng hoảng hôn nhân/tình cảm. Càng đi sâu tìm hiểu hồ sơ vụ việc,
      nhân vật chính càng phát hiện những chi tiết trùng hợp đến rùng mình:
      hoá ra "nạn nhân" bị phản bội, lừa dối trong câu chuyện đó không ai
      khác chính là bản thân mình, còn "khách hàng" và sếp đều có liên quan
      trực tiếp đến bi kịch này. Từ một người ngoài cuộc tư vấn cho người
      khác, nhân vật chính buộc phải đối mặt với sự thật đau đớn về chính
      cuộc đời mình, dùng chính nghiệp vụ và bản lĩnh của một chuyên gia tình
      cảm để vạch trần âm mưu, đòi lại công bằng và tự tay viết lại cái kết
      cho câu chuyện của chính mình.
  - id: trong_sinh_nghe_long_ke_hai_minh
    name: "Trùng sinh tôi nghe được tiếng lòng của người đã hại mình"
    description: >
      Nhân vật chính chết oan trong kiếp trước vì bị chính những người thân
      cận nhất phản bội, hãm hại. Trọng sinh trở về trước thời điểm bi kịch
      xảy ra, nhân vật chính bất ngờ có thêm khả năng đặc biệt: nghe được
      chính xác suy nghĩ thật trong lòng của bất kỳ ai, đặc biệt là những kẻ
      đã hại mình ở kiếp trước. Nhờ vừa có ký ức kiếp trước vừa nghe thấu
      được lòng dạ thật của từng người, nhân vật chính dễ dàng nhận ra âm mưu
      đang thai nghén, thấy rõ ai thật lòng ai giả dối, từ đó từng bước né
      tránh bi kịch cũ, vạch trần và trả đũa những kẻ hai mặt trước khi
      chúng kịp ra tay, giành lại tất cả những gì đáng lẽ thuộc về mình.
  - id: hop_dong_hon_nhan_trieu_do
    name: "Hợp Đồng Hôn Nhân Triệu Đô: Trọng Sinh Trở Thành Con Gái Nuôi Của Trùm Tài Chính"
    description: >
      Kiếp trước nhân vật chính bị chồng và người thân lừa dối, mất sạch tài
      sản lẫn người thân rồi chết trong uất hận. Trọng sinh về thời điểm mọi
      thứ chưa đổ vỡ, cô không lao vào báo thù trực diện mà chọn nước cờ cao
      hơn: tìm đến một ông trùm tài chính bí ẩn vốn là đối thủ không đội trời
      chung của kẻ thù, đặt lên bàn một bản hợp đồng — hôn nhân giả hoặc nhận
      làm con gái nuôi — để mượn thế lực mà lật ngược thế cờ. Câu chuyện xoay
      quanh những màn đấu trí trên thương trường: thâu tóm cổ phần, gài bẫy
      dòng tiền, bóc trần sổ sách giả, giành lại từng tài sản đã mất. Nữ chính
      lạnh lùng, sắc sảo, tự tay kiểm soát tài chính chứ không chờ ai giải
      cứu; ông trùm trầm ổn, quyền lực, ban đầu chỉ xem đây là một thương vụ
      nhưng dần trở thành chỗ dựa thật lòng. Cao trào là màn vả mặt công khai
      giữa đại hội cổ đông, kẻ thù mất trắng và dính vòng lao lý, còn nhân vật
      chính từ tay trắng vươn lên thành người nắm quyền lực tài chính thật sự.
